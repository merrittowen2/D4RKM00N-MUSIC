<script>
    function revealSecret() {

        const album = document.querySelector(".secret-album");

        if (album.classList.contains("revealed")) {

            album.classList.remove("revealed");

        } else {

            album.classList.add("glitching");

            setTimeout(function () {
                album.classList.remove("glitching");
                album.classList.add("revealed");
            }, 450);

        }
    }
</script>

<script>
const pageMenu = document.getElementById("pageMenu");
const pageMenuButton = document.getElementById("pageMenuButton");

pageMenuButton.addEventListener("click", function () {
    const isOpen = pageMenu.classList.toggle("open");

    pageMenuButton.setAttribute(
        "aria-expanded",
        isOpen ? "true" : "false"
    );
});

/* Close when clicking outside */

document.addEventListener("click", function (event) {

    if (!pageMenu.contains(event.target)) {
        pageMenu.classList.remove("open");

        pageMenuButton.setAttribute(
            "aria-expanded",
            "false"
        );
    }

});

/* Close with Escape */

document.addEventListener("keydown", function (event) {

    if (event.key === "Escape") {
        pageMenu.classList.remove("open");

        pageMenuButton.setAttribute(
            "aria-expanded",
            "false"
        );
    }

});
</script>
<script>
